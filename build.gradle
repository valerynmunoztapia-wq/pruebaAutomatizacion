plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'
buildDir = file(System.getProperty("user.home") + "\\.gradle-build\\pruebaAutomatizacion")

repositories {
    mavenCentral()
}

java{
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {

    // Selenium
    implementation 'org.seleniumhq.selenium:selenium-java:4.30.0'
    implementation 'net.java.dev.jna:jna:5.14.0'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.14.0'
    testImplementation 'io.cucumber:cucumber-junit:7.14.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JUnit 4 (compatible con Cucumber)
    testImplementation 'junit:junit:4.13.2'

    // IA
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
}

test {
    useJUnit()
    include '**/*Test.class', '**/*Tests.class', '**/*TestCase.class', '**/Runner.class'
    testLogging {
        events "passed", "skipped", "failed"
    }
}
